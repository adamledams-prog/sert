<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sert — accueil</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 28px;
  }

  h1 {
    font-size: clamp(1.4rem, 5vw, 1.8rem);
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #fff;
    text-align: center;
  }

  .subtitle {
    color: #889;
    font-size: 0.95rem;
    text-align: center;
    max-width: 360px;
    line-height: 1.5;
  }

  nav {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 320px;
  }

  .menu-btn {
    display: block;
    text-align: center;
    text-decoration: none;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 18px 20px;
    border-radius: 12px;
    border: 1px solid #444;
    transition: transform 0.12s, filter 0.12s;
  }
  .menu-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
  }

  .menu-btn.tier {
    background: linear-gradient(135deg, #e74c3c, #c0392b);
  }
  .menu-btn.wheel {
    background: linear-gradient(135deg, #f39c12, #d68910);
  }
  .menu-btn.code {
    background: linear-gradient(135deg, #4a6cf7, #6b48ff);
  }

  .menu-btn span {
    display: block;
    font-size: 0.8rem;
    font-weight: 400;
    opacity: 0.85;
    margin-top: 4px;
  }

  .hint {
    font-size: 0.8rem;
    color: #667;
    text-align: center;
    max-width: 340px;
  }
</style>
</head>
<body>

<h1>Sert</h1>
<p class="subtitle">Choisis une page</p>

<nav>
  <a class="menu-btn tier" href="tierlist.html">
    Tier list
    <span>Classe tes brawlers</span>
  </a>
  <a class="menu-btn wheel" href="wheel.html">
    Roue
    <span>Tirage aléatoire</span>
  </a>
  <a class="menu-btn code" href="code.html">
    Code écran
    <span>Téléphone crée le code → PC regarde</span>
  </a>
</nav>

</body>
</html>
